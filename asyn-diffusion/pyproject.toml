[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asyndiff-cosmio"
version = "0.1.0"
description = "Asyn-diffusion baseline for LSST/Euclid/Roman nonlens imputation."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26,<3",
  "pyyaml>=6.0",
  "tensorboard>=2.16",
  "torch>=2.4,<3",
  "zarr>=2.18,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
asyndiff_build_index = "asyndiff.cli:build_index_main"
asyndiff_train_diffusion = "asyndiff.cli:train_diffusion_main"
asyndiff_sample = "asyndiff.cli:sample_main"
asyndiff_render_curves = "asyndiff.cli:render_curves_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

