name: CI

on:
  push:
  pull_request:

# The workflow only reads the checkout; withhold the write scopes the
# default GITHUB_TOKEN would otherwise carry once this repository is public.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-deps torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -c constraints-py310-linux.txt -r requirements.txt pytest
      - run: python -m pip install -e asyn-diffusion -e vit-lens-classification
      - run: python -m pip check
      - run: python -m pytest tests asyn-diffusion/tests -q
      - run: python -m pytest vit-lens-classification/tests -q
