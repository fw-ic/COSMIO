experiment:
  name: imputed_roman_imputed_nonlens
  output_root: vit-lens-classification/runs

data:
  manifest_path: vit-lens-classification/artifacts/imputed_roman_imputed_nonlens_manifest.json
  image_size: 224
  num_workers: 4

model:
  in_channels: 3
  image_size: 224
  patch_size: 16
  num_layers: 6
  num_heads: 8
  hidden_dim: 256
  mlp_dim: 512
  dropout: 0.0
  attention_dropout: 0.0

train:
  seed: 1337
  batch_size: 64
  epochs: 10
  lr: 1.0e-4
  weight_decay: 1.0e-4
  balanced_sampling: true
  max_train_steps: null
  max_eval_batches: null
  checkpoint_every_epochs: 5
  device: auto

evaluation:
  split: eval
  threshold: 0.5

