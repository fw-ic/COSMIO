[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vit-lens-classification-cosmio"
version = "0.1.0"
description = "Roman-only ViT lens-vs-nonlens classification utilities for COSMIO."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26,<3",
  "pyyaml>=6.0",
  "torch>=2.4,<3",
  "torchvision>=0.19",
  "zarr>=2.18,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
vit_lens_build_real_roman_manifest = "vit_lens_classification.build_real_roman_manifest:main"
vit_lens_build_imputed_roman_manifest = "vit_lens_classification.build_imputed_roman_manifest:main"
vit_lens_train = "vit_lens_classification.train_vit:main"
vit_lens_evaluate = "vit_lens_classification.evaluate_vit:main"
vit_lens_visualize_imputed_roman = "vit_lens_classification.visualize_imputed_roman_samples:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

